<form (submit)="addMeal($event)">
    <label for="mealName">Nom du repas</label>
    <input type="text" id="mealName" [formField]="mealForm.name" />

    <label for="mealIngredients">Ingrédients du repas</label>
    <input type="text" id="mealIngredients" [formField]="mealForm.ingredients" />

    <label for="mealRecipe">Recette du repas</label>
    <input type="text" id="mealRecipe" [formField]="mealForm.recipe" />

    <select id="mealType" [formField]="mealForm.type">
        <option id="starter">Entrée</option>
        <option id="main">Repas principal</option>
        <option id="dessert">Dessert</option>
    </select>

    <label for="mealPreparationTime">Temps de préparation</label>
    <input type="number" id="mealPreparationTime" [formField]="mealForm.preparation" />

    <label for="mealCookingTime">Temps de cuisson</label>
    <input type="number" id="mealCookingTime" [formField]="mealForm.cooking" />

    <button type="submit">Ajouter</button>
</form>

<ul>
    @for (meal of meals(); track $index) {
    <li>
        <h3>{{ meal.name }}</h3>
        <p>Ingrédients : {{ meal.ingredients }}</p>
        <p>Recette : {{ meal.recipe }}</p>
        <p>Type : {{ meal.type }}</p>
        <p>Temps de préparation : {{ meal.preparation }}</p>
        <p>Temps de cuisson : {{ meal.cooking }}</p>
    </li>
    }
</ul>
